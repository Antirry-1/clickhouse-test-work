table_name: cohort_retention
main_dttm_col: cohort_month
description: null
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: sms
sql: "WITH first_seen AS (\n    SELECT receiver, toStartOfMonth(min(sent_date)) AS\
  \ cohort_month\n    FROM sms.messages_mart_active WHERE receiver IS NOT NULL GROUP\
  \ BY receiver),\nactivity AS (\n    SELECT f.cohort_month AS cohort_month,\n   \
  \        dateDiff('month', f.cohort_month, toStartOfMonth(m.sent_date)) AS month_index,\n\
  \           m.receiver AS receiver\n    FROM sms.messages_mart_active AS m INNER\
  \ JOIN first_seen AS f USING (receiver)),\ncohort AS (\n    SELECT cohort_month,\
  \ month_index, uniqExact(receiver) AS active_receivers\n    FROM activity GROUP\
  \ BY cohort_month, month_index)\nSELECT cohort_month, month_index, active_receivers,\n\
  \       round(100 * active_receivers /\n             first_value(active_receivers)\n\
  \                 OVER (PARTITION BY cohort_month ORDER BY month_index), 1) AS retention_pct\n\
  FROM cohort"
